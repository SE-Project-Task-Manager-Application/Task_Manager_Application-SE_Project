name: CI

# Runs on every pull request, and on pushes to dev and main.
on:
  pull_request:
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

  test:
    runs-on: ubuntu-latest

    # Same database as docker-compose.yml (PostgreSQL 16).
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: taskmanager
          POSTGRES_USER: tm
          POSTGRES_PASSWORD: change_me_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tm -d taskmanager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Same variable names as .env.example.
    env:
      DB_NAME: taskmanager
      DB_USER: tm
      DB_PASSWORD: change_me_test_only
      DB_HOST: localhost
      DB_PORT: "5432"
      EMAIL_HOST: localhost
      EMAIL_PORT: "1025"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # requirements.txt is added by S-01; skip it until it exists.
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: pytest
