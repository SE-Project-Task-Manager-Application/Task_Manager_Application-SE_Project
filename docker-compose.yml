services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
            - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mailhog:
    image: mailhog/mailhog
    ports:
          - "127.0.0.1:1025:1025"   # SMTP
          - "127.0.0.1:8025:8025"   # web inbox

volumes:
  pgdata:
