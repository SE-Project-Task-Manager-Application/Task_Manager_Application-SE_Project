{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
  <h1>Change password</h1>
  <form method="post" class="form">
    {% csrf_token %}
    <div class="field field--required">
      <label for="id_old_password">Current password</label>
      <input type="password" name="old_password" id="id_old_password" autocomplete="current-password" required autofocus>
      {{ form.old_password.errors }}
    </div>
    <div class="field field--required">
      <label for="id_new_password1">New password</label>
      <input type="password" name="new_password1" id="id_new_password1" autocomplete="new-password" required>
      {{ form.new_password1.errors }}
    </div>
    <div class="field field--required">
      <label for="id_new_password2">Confirm new password</label>
      <input type="password" name="new_password2" id="id_new_password2" autocomplete="new-password" required>
      {{ form.new_password2.errors }}
    </div>
    <button class="button" type="submit">Change password</button>
  </form>
  <p><a href="{% url 'accounts:profile' %}">Back to profile</a></p>
{% endblock %}
