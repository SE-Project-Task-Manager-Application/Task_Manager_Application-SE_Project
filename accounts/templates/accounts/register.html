<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create an account</title>
</head>
<body>
    <main>
        <h1>Create an account</h1>

        <form method="post">
            {% csrf_token %}

            {{ form.non_field_errors }}

            {% for field in form %}
                <div>
                    {{ field.label_tag }}
                    {{ field }}

                    {% if field.help_text %}
                        <div>{{ field.help_text }}</div>
                    {% endif %}

                    {{ field.errors }}
                </div>
            {% endfor %}

            <button type="submit">Create account</button>
        </form>
    </main>
</body>
</html>
