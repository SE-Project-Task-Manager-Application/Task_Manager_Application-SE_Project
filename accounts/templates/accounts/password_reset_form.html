{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
  <h1>Reset your password</h1>
  <p>Enter your email address and we will send you a link to choose a new password.</p>
  <form method="post" class="form">
    {% csrf_token %}
    <div class="field field--required">
      <label for="id_email">Email address</label>
      <input type="email" name="email" id="id_email" autocomplete="email" required autofocus>
      {{ form.email.errors }}
    </div>
    <button class="button" type="submit">Send reset link</button>
  </form>
  <p><a href="{% url 'accounts:login' %}">Back to log in</a></p>
{% endblock %}
